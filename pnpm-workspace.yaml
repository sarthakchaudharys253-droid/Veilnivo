allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true

nodeLinker: hoisted
storeDir: .pnpm-store
packageImportMethod: copy



networkConcurrency: 4
childConcurrency: 1

# Prisma config uses plain records; retain the maintained cycle-safe implementation.
overrides:
  '@prisma/config>deepmerge-ts': 8.0.0
